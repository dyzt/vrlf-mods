<?xml version="1.0"?>
<mameconfig version="10">
	<system name="default">

		<!-- VRLF XInput lightgun configuration.
		     Maps lightguns to vigembus analog joysticks -->

		<input>
			<port type="P1_LIGHTGUN_X">
				<newseq type="standard">JOYCODE_1_XAXIS</newseq>
			</port>
			<port type="P1_LIGHTGUN_Y">
				<newseq type="standard">JOYCODE_1_YAXIS</newseq>
			</port>
			<port type="P2_LIGHTGUN_X">
				<newseq type="standard">JOYCODE_2_XAXIS</newseq>
			</port>
			<port type="P2_LIGHTGUN_Y">
				<newseq type="standard">JOYCODE_2_YAXIS</newseq>
			</port>

			<port type="P1_AD_STICK_X">
				<newseq type="standard">JOYCODE_1_XAXIS</newseq>
			</port>
			<port type="P1_AD_STICK_Y">
				<newseq type="standard">JOYCODE_1_YAXIS</newseq>
			</port>
			<port type="P2_AD_STICK_X">
				<newseq type="standard">JOYCODE_2_XAXIS</newseq>
			</port>
			<port type="P2_AD_STICK_Y">
				<newseq type="standard">JOYCODE_2_YAXIS</newseq>
			</port>

			<!-- Other ABSOLUTE analog aim ports. A handful of gun-ish games
			     expose aim as a paddle or positional control rather than as a
			     lightgun; these behave 1:1 exactly like the AD_STICK pair above.
			     Ports a machine does not have are simply ignored by MAME, so
			     these are free to carry for every game. -->
			<port type="P1_PADDLE">
				<newseq type="standard">JOYCODE_1_XAXIS</newseq>
			</port>
			<port type="P1_PADDLE_V">
				<newseq type="standard">JOYCODE_1_YAXIS</newseq>
			</port>
			<port type="P2_PADDLE">
				<newseq type="standard">JOYCODE_2_XAXIS</newseq>
			</port>
			<port type="P2_PADDLE_V">
				<newseq type="standard">JOYCODE_2_YAXIS</newseq>
			</port>

			<port type="P1_POSITIONAL">
				<newseq type="standard">JOYCODE_1_XAXIS</newseq>
			</port>
			<port type="P1_POSITIONAL_V">
				<newseq type="standard">JOYCODE_1_YAXIS</newseq>
			</port>
			<port type="P2_POSITIONAL">
				<newseq type="standard">JOYCODE_2_XAXIS</newseq>
			</port>
			<port type="P2_POSITIONAL_V">
				<newseq type="standard">JOYCODE_2_YAXIS</newseq>
			</port>

			<!-- RELATIVE analog ports (dial / trackball / mouse). MAME feeds a
			     joystick axis into these as a RATE, not a position, so VRLF aim
			     becomes "point off-centre to slide the cursor that way" rather
			     than true absolute aim. Present as a fallback, not as parity. -->
			<port type="P1_DIAL">
				<newseq type="standard">JOYCODE_1_XAXIS</newseq>
			</port>
			<port type="P1_DIAL_V">
				<newseq type="standard">JOYCODE_1_YAXIS</newseq>
			</port>
			<port type="P2_DIAL">
				<newseq type="standard">JOYCODE_2_XAXIS</newseq>
			</port>
			<port type="P2_DIAL_V">
				<newseq type="standard">JOYCODE_2_YAXIS</newseq>
			</port>

			<port type="P1_TRACKBALL_X">
				<newseq type="standard">JOYCODE_1_XAXIS</newseq>
			</port>
			<port type="P1_TRACKBALL_Y">
				<newseq type="standard">JOYCODE_1_YAXIS</newseq>
			</port>
			<port type="P2_TRACKBALL_X">
				<newseq type="standard">JOYCODE_2_XAXIS</newseq>
			</port>
			<port type="P2_TRACKBALL_Y">
				<newseq type="standard">JOYCODE_2_YAXIS</newseq>
			</port>
		</input>
	</system>

	<!-- ================================================================
	     Sports Shooting USA (Sammy / Atomiswave, 2003).

	     MAME 0.285 does NOT emulate this game's gun I/O. Dumped live, the
	     machine exposes ZERO analog input fields - only P1/P2 digital 8-way
	     JOYSTICK_UP/DOWN/LEFT/RIGHT plus six buttons. So every analog port
	     bound above (LIGHTGUN, AD_STICK, PADDLE, POSITIONAL...) attaches to
	     nothing here; there is no absolute-aim path to bind at all.

	     The only route left is MAME's axis-to-switch conversion: the VRLF
	     aim stick drives the digital directions. That is STEERING, not aim -
	     point left of screen centre and the in-game cursor slides left until
	     you re-centre. Playable, not accurate.

	     Threshold is joystick_deadzone, which is globally 0 for lightgun
	     accuracy; ini/sprtshot.ini raises it for this game only, otherwise
	     the tiniest off-centre offset holds a direction forever.

	     If UP/DOWN come out inverted, swap the YAXIS_UP/DOWN switches here
	     (mame_basic.json runs pad_aim_scale.y = -1.0).
	     ================================================================ -->
	<system name="sprtshot">
		<input>
			<port type="P1_JOYSTICK_UP">
				<newseq type="standard">KEYCODE_UP OR JOYCODE_1_YAXIS_UP_SWITCH</newseq>
			</port>
			<port type="P1_JOYSTICK_DOWN">
				<newseq type="standard">KEYCODE_DOWN OR JOYCODE_1_YAXIS_DOWN_SWITCH</newseq>
			</port>
			<port type="P1_JOYSTICK_LEFT">
				<newseq type="standard">KEYCODE_LEFT OR JOYCODE_1_XAXIS_LEFT_SWITCH</newseq>
			</port>
			<port type="P1_JOYSTICK_RIGHT">
				<newseq type="standard">KEYCODE_RIGHT OR JOYCODE_1_XAXIS_RIGHT_SWITCH</newseq>
			</port>

			<port type="P2_JOYSTICK_UP">
				<newseq type="standard">KEYCODE_R OR JOYCODE_2_YAXIS_UP_SWITCH</newseq>
			</port>
			<port type="P2_JOYSTICK_DOWN">
				<newseq type="standard">KEYCODE_F OR JOYCODE_2_YAXIS_DOWN_SWITCH</newseq>
			</port>
			<port type="P2_JOYSTICK_LEFT">
				<newseq type="standard">KEYCODE_D OR JOYCODE_2_XAXIS_LEFT_SWITCH</newseq>
			</port>
			<port type="P2_JOYSTICK_RIGHT">
				<newseq type="standard">KEYCODE_G OR JOYCODE_2_XAXIS_RIGHT_SWITCH</newseq>
			</port>
		</input>
	</system>
</mameconfig>
